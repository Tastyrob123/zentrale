<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Abmelden · Post aus dem Studio</title>
<link rel="stylesheet" href="/zentrale/zentrale/grund.css">
<link rel="stylesheet" href="seite.css">
<script>(function () { var z = function () { document.documentElement.classList.add('da'); }; if (document.fonts && document.fonts.ready) { document.fonts.ready.then(z); setTimeout(z, 1500); } else { z(); } })();</script>

<body>
<main class="blatt-seite">
  <p class="mono">Tasty Studios · Post aus dem Studio</p>
  <h1 id="titel">Möchten Sie sich abmelden?</h1>
  <p id="text">Dann bekommen Sie keine Post aus dem Studio mehr. Ein Klick genügt.</p>
  <p id="taten"><button type="button" class="kn" id="knAbmelden">Ja, abmelden</button></p>
  <p><a href="/zentrale/seite/index.html" id="weiter" hidden>Zur Seite von Tasty Studios</a></p>
</main>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('token') || '';
  document.getElementById('knAbmelden').onclick = function () {
    this.disabled = true;
    fetch('/zentrale/api/10-newsletter/abmelden', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) })
      .then(function (r) { return r.json().then(function (a) { return { ok: r.ok && !a.fehler, a: a }; }); })
      .then(function (x) {
        document.getElementById('taten').hidden = true;
        if (x.ok) {
          document.getElementById('titel').textContent = 'Sie sind abgemeldet.';
          document.getElementById('text').textContent = 'Die Adresse ' + x.a.empfaenger.mail + ' bekommt keine Post aus dem Studio mehr. Danke, dass Sie eine Weile dabei waren.';
        } else {
          document.getElementById('titel').textContent = 'Das ging nicht.';
          document.getElementById('text').textContent = x.a.fehler || 'Dieser Link ist nicht mehr gültig. Schreiben Sie uns kurz, dann erledigen wir es von Hand.';
        }
        document.getElementById('weiter').hidden = false;
      })
      .catch(function () { document.getElementById('titel').textContent = 'Das ging nicht.'; document.getElementById('text').textContent = 'Der Server antwortet nicht. Bitte später noch einmal.'; });
  };
})();
</script>
</body>
</html>
