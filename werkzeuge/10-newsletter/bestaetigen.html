<meta charset="utf-8">

<title>Anmeldung bestätigen · Post aus dem Studio</title>
<link rel="stylesheet" href="/zentrale/zentrale/grund.css">
<link rel="stylesheet" href="seite.css">

<body>
<main class="blatt-seite">
  <p class="mono">Tasty Studios · Post aus dem Studio</p>
  <h1 id="titel">Einen Moment.</h1>
  <p id="text">Die Anmeldung wird bestätigt.</p>
  <p><a href="/zentrale/seite/index.html#betreuung" id="weiter" hidden>Zur Seite von Tasty Studios</a></p>
</main>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('token') || '';
  fetch('/zentrale/api/10-newsletter/bestaetigen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) })
    .then(function (r) { return r.json().then(function (a) { return { ok: r.ok && !a.fehler, a: a }; }); })
    .then(function (x) {
      var e = x.a.empfaenger;
      if (x.ok) {
        document.getElementById('titel').textContent = 'Danke, Sie sind dabei.';
        document.getElementById('text').textContent = (e.name ? e.name + ', ' : '') + 'Ihre Adresse ' + e.mail + ' ist bestätigt. Die nächste Post aus dem Studio kommt zu Ihnen.';
      } else {
        document.getElementById('titel').textContent = 'Das ging nicht.';
        document.getElementById('text').textContent = x.a.fehler || 'Dieser Link ist nicht mehr gültig.';
      }
      document.getElementById('weiter').hidden = false;
    })
    .catch(function () { document.getElementById('titel').textContent = 'Das ging nicht.'; document.getElementById('text').textContent = 'Der Server antwortet nicht. Bitte später noch einmal.'; });
})();
</script>
