<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111421">
<title>Vorschau · Beiträge · Tasty Studios</title>
<link rel="icon" href="/zentrale/zentrale/oberflaeche/kleid/anker-zeichen.svg" type="image/svg+xml">
<!-- «Gross öffnen» aus dem Kopf der Vorschau (wie in Le Bureau): der Beitrag allein, gross, wie er auf LinkedIn steht.
     Nimmt den Stand aus dem Werkzeug, das ihn geöffnet hat (auch noch nicht Gespeichertes), und folgt ihm, solange beide offen sind.
     Ohne Werkzeug dahinter: der gespeicherte Stand aus ?entwurf=<id>. -->
<script src="/zentrale/zentrale/oberflaeche/kleid/tasty.js"></script>
<link rel="stylesheet" href="welt.css">
<link rel="stylesheet" href="/zentrale/zentrale/oberflaeche/grund.css"><link rel="stylesheet" href="/zentrale/zentrale/oberflaeche/kleid/tasty.css">
<link rel="stylesheet" href="beitraege.css">
<style>
html,body{margin:0;min-height:100%}
body{background:var(--wo-papier2);font:15px/1.5 var(--wo-sans);color:var(--wo-tinte)}
.vs{display:flex;justify-content:center;align-items:flex-start;padding:clamp(16px,5vw,56px) 16px 64px;box-sizing:border-box}
.vs .bt-post mark{background:none;box-shadow:none;outline:0;cursor:auto}
.vs .bt-post__text.ist-zu{display:block;-webkit-line-clamp:none;line-clamp:none}
.vs .bt-post__mehr{display:none}
.vs__leer{max-width:440px;text-align:center;color:var(--wo-leise)}
</style>
</head>
<body>
<main class="vs" id="vs"><p class="vs__leer">Die Vorschau kommt aus dem Werkzeug «Beiträge». Öffne sie dort mit «Gross öffnen».</p></main>
<script>
(function () {
  var ort = document.getElementById('vs'), zuletzt = '';
  function quelle() { try { return window.opener && !window.opener.closed && window.opener.document.querySelector('#bt-feed .bt-post'); } catch (e) { return null; } }
  function zeige() {
    var q = quelle(); if (!q) return false;
    var h = q.outerHTML; if (h === zuletzt) return true;
    zuletzt = h; ort.innerHTML = h;
    var t = ort.querySelector('.bt-post__text'); if (t) t.classList.remove('ist-zu');
    return true;
  }
  function gespeichert() {
    var id = new URLSearchParams(location.search).get('entwurf'); if (!id) return;
    fetch('/zentrale/api/08-beitraege/entwurf?id=' + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      var e = d && (d.entwurf || d); if (!e || !e.abschnitte) return;
      var text = e.abschnitte.map(function (a) { return a.text; }).filter(Boolean).join('\n\n') + (e.hashtags ? '\n\n' + e.hashtags : '');
      var art = document.createElement('article'); art.className = 'bt-post';
      art.innerHTML = '<header class="bt-post__kopf"><span class="bt-post__bild" aria-hidden="true">RR</span><span class="bt-post__wer"><b>Robert Reff</b><span>Tasty Studios · Websites und Backoffice für Gastronomie und Hotellerie</span><small>Gespeicherter Stand</small></span></header><div class="bt-post__text"></div><footer class="bt-post__fuss"><span>Gefällt mir</span><span>Kommentieren</span><span>Teilen</span></footer>';
      art.querySelector('.bt-post__text').textContent = text;
      ort.innerHTML = ''; ort.appendChild(art);
    }).catch(function () {});
  }
  if (!zeige()) gespeichert();
  setInterval(zeige, 800);
})();
</script>
</body>
</html>
