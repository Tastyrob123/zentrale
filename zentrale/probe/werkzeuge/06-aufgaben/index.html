<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufgaben (Probe)</title>
<link rel="stylesheet" href="/zentrale/zentrale/grund.css">
<style>
  /* Probe-Werkzeug: nur so viel Oberfläche, dass die Zentrale geprüft werden kann. */
  body { padding: clamp(20px, 3vw, 40px) clamp(16px, 3vw, 48px); }
  h1 { font-size: clamp(30px, 3.2vw, 44px); }
  .wer { color: var(--leise); margin: 0 0 28px; }
  .gruppe { margin-bottom: 32px; }
  .gruppe h2 { font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .zeile { display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--linie); }
  .zeile:last-child { border-bottom: 1px solid var(--linie); }
  .zeile.hell { background: rgba(243, 236, 226, .05); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 8px; }
  .haus { color: var(--leise); font-size: 14px; }
  .stand { font-family: var(--mono); font-size: 12px; color: var(--leise); white-space: nowrap; }
  .stand.spaet { color: var(--rot); }
  @media (max-width: 600px) { .zeile { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<h1>Aufgaben</h1>
<p class="wer" id="wer"></p>
<div id="liste"></div>
<script>
  // Die Zentrale gibt «wer» und, über «Heute», «aufgabe» mit. Beides wird hier nur gezeigt.
  const q = new URLSearchParams(location.search);
  const wer = q.get('wer') || '';
  const markiert = q.get('aufgabe') || '';
  document.getElementById('wer').textContent = wer ? 'Angemeldet als ' + wer + '. Deine Aufgaben stehen oben.' : 'Ohne Namen geöffnet: alle Aufgaben.';
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const tage = n => new Date(heute.getTime() + n * 864e5).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });

  fetch('/zentrale/api/06-aufgaben/aufgaben').then(r => r.json()).then(d => {
    const alle = d.aufgaben;
    const meine = wer ? alle.filter(a => a.wer === wer) : alle;
    const andere = wer ? alle.filter(a => a.wer !== wer) : [];
    const wurzel = document.getElementById('liste');
    const gruppe = (titel, liste) => {
      if (!liste.length) return;
      const g = document.createElement('section'); g.className = 'gruppe';
      g.innerHTML = '<h2></h2>'; g.querySelector('h2').textContent = titel;
      for (const a of liste) {
        const z = document.createElement('div'); z.className = 'zeile' + (String(a.nr) === markiert ? ' hell' : '');
        z.id = 'aufgabe-' + a.nr;
        const spaet = a.bis && a.bis < heute.toISOString().slice(0, 10) && a.stand !== 'erledigt';
        z.innerHTML = '<div><div class="titel"></div><div class="haus"></div></div><div class="stand"></div>';
        z.querySelector('.titel').textContent = a.titel;
        z.querySelector('.haus').textContent = [a.haus, a.wer].filter(Boolean).join(' · ');
        const s = z.querySelector('.stand');
        s.textContent = (a.bis ? 'bis ' + new Date(a.bis).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }) + ' · ' : '') + a.stand;
        if (spaet) s.classList.add('spaet');
        g.appendChild(z);
      }
      wurzel.appendChild(g);
    };
    gruppe(wer ? 'Meine' : 'Alle', meine);
    gruppe('Die anderen', andere);
    const m = markiert && document.getElementById('aufgabe-' + markiert);
    if (m) m.scrollIntoView({ block: 'center' });
  });
</script>
</body>
</html>
