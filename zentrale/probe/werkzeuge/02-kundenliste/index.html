<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kundenliste (Probe)</title>
<link rel="stylesheet" href="/zentrale/zentrale/grund.css">
<style>
  /* Probe-Werkzeug: nur so viel Oberfläche, dass die Zentrale geprüft werden kann. */
  body { padding: clamp(20px, 3vw, 40px) clamp(16px, 3vw, 48px); }
  h1 { font-size: clamp(30px, 3.2vw, 44px); }
  .wer { color: var(--leise); margin: 0 0 28px; }
  .haus { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px 20px; padding: 14px 0; border-top: 1px solid var(--linie); scroll-margin-top: 20px; }
  .haus:last-child { border-bottom: 1px solid var(--linie); }
  .haus.hell { background: rgba(243, 236, 226, .05); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 8px; }
  .haus b { font-weight: 600; display: block; }
  .haus small { color: var(--leise); }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--leise); }
  @media (max-width: 600px) { .haus { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<h1>Kundenliste</h1>
<p class="wer" id="wer"></p>
<div id="liste"></div>
<script>
  const wer = new URLSearchParams(location.search).get('wer') || '';
  document.getElementById('wer').textContent = wer ? 'Geöffnet von ' + wer + '.' : 'Ohne Namen geöffnet.';
  fetch('/zentrale/api/02-kundenliste/haeuser').then(r => r.json()).then(d => {
    const wurzel = document.getElementById('liste');
    for (const h of d.haeuser) {
      const z = document.createElement('div'); z.className = 'haus'; z.id = h.kuerzel;
      z.innerHTML = '<div><b></b><small></small></div><div class="stand"></div><div class="mono"></div>';
      z.querySelector('b').textContent = h.name;
      z.querySelector('small').textContent = h.ort;
      z.querySelector('.stand').textContent = h.stand;
      z.querySelector('.mono').textContent = h.naechster ? h.naechster + (h.bis ? ' · bis ' + new Date(h.bis).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }) : '') : 'kein nächster Schritt';
      wurzel.appendChild(z);
    }
    // Der Anker aus der Zentrale (#kuerzel) kommt vor der Liste an; deshalb nach dem Aufbau noch einmal hinspringen.
    if (location.hash) { const z = document.getElementById(location.hash.slice(1)); if (z) { z.classList.add('hell'); z.scrollIntoView({ block: 'center' }); } }
  });
</script>
</body>
</html>
